name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Fast Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Fast Gate
        run: python -m unittest discover

  freecad-regression:
    name: FreeCAD View Regression
    runs-on: windows-latest
    needs: backend-tests
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Install FreeCAD
        run: choco install freecad -y --no-progress

      - name: Resolve FreeCAD Python
        run: |
          $candidates = @(
            "C:\\Program Files\\FreeCAD 1.0\\bin\\python.exe",
            "C:\\Program Files\\FreeCAD\\bin\\python.exe",
            "C:\\ProgramData\\chocolatey\\lib\\freecad\\tools\\FreeCAD\\bin\\python.exe"
          )
          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              "FREECAD_PYTHON=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              Write-Host "Using FREECAD_PYTHON=$candidate"
              exit 0
            }
          }
          Write-Error "FreeCAD python.exe not found after installation."
          exit 1

      - name: Run View Regression with Stability Loop
        run: python server/test_views.py --stability-runs 2
