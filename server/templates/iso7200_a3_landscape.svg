<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
  <defs>
    <style>
      .border { fill: none; stroke: #000; stroke-width: 0.5; }
      .grid { fill: none; stroke: #000; stroke-width: 0.35; }
      .label {
        font-family: ISOCP, "ISO 3098", "Hershey Simplex", "Simplex", monospace;
        font-size: 3.5px;
        fill: #000;
        font-style: normal;
        font-weight: normal;
      }
      .value {
        font-family: ISOCP, "ISO 3098", "Hershey Simplex", "Simplex", monospace;
        font-size: 5px;
        fill: #000;
        font-style: normal;
        font-weight: normal;
      }
    </style>
  </defs>

  <rect class="border" x="10" y="10" width="400" height="277" />

  <rect class="grid" x="230" y="232" width="180" height="55" />
  <line class="grid" x1="230" y1="247" x2="410" y2="247" />
  <line class="grid" x1="230" y1="257" x2="410" y2="257" />
  <line class="grid" x1="230" y1="272" x2="410" y2="272" />

  <line class="grid" x1="330" y1="247" x2="330" y2="257" />
  <line class="grid" x1="310" y1="257" x2="310" y2="287" />
  <line class="grid" x1="370" y1="257" x2="370" y2="287" />

  <text class="label" x="232" y="238">TITLE</text>
  <text class="value" id="TITLE" x="232" y="244">Manufacturing Drawing</text>

  <text class="label" x="332" y="238">COMPANY</text>
  <text class="value" id="COMPANY" x="332" y="244">Drawform</text>

  <text class="label" x="232" y="252">DRAWING NO</text>
  <text class="value" id="DRAWING_NO" x="232" y="256">DF-0001</text>

  <text class="label" x="332" y="252">REV</text>
  <text class="value" id="REV" x="332" y="256">A</text>

  <text class="label" x="232" y="262">AUTHOR</text>
  <text class="value" id="AUTHOR" x="232" y="270">Drawform AI</text>

  <text class="label" x="312" y="262">DATE</text>
  <text class="value" id="DATE" x="312" y="270">2025-01-01</text>

  <text class="label" x="372" y="262">SCALE</text>
  <text class="value" id="SCALE" x="372" y="270">auto</text>

  <text class="label" x="232" y="277">UNIT</text>
  <text class="value" id="UNIT" x="232" y="285">mm</text>

  <text class="label" x="312" y="277">SHEET</text>
  <text class="value" id="SHEET" x="312" y="285">A3</text>
</svg>
